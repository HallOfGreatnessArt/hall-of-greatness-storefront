name: One-time publish approved EMBRACE OF ETERNITY landing page

on:
  push:
    branches:
      - main
    paths:
      - "gumroad-publish-trigger/embrace-of-eternity-approved.txt"

permissions:
  contents: read

concurrency:
  group: gumroad-approved-embrace-landing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out approved landing page
        uses: actions/checkout@v4

      - name: Verify exact Gumroad product and landing source
        run: |
          set -euo pipefail
          test -s gumroad-landings/embrace-of-eternity/landing.html
          grep -q 'EMBRACE OF ETERNITY' gumroad-landings/embrace-of-eternity/landing.html
          grep -q '92xq9gat8tn70rgpuo2wez73duwq' gumroad-landings/embrace-of-eternity/landing.html
          grep -q 'data-gumroad-action="buy"' gumroad-landings/embrace-of-eternity/landing.html

      - name: Install Gumroad CLI
        run: |
          set -euo pipefail
          curl -fsSL https://gumroad.com/install-cli.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          command -v gumroad
          gumroad --help >/dev/null

      - name: Preview and require clean Gumroad sanitization
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GUMROAD_ACCESS_TOKEN:-}" || {
            echo "::error::Repository secret GUMROAD_ACCESS_TOKEN is not configured."
            exit 1
          }
          mkdir -p gumroad-publish-evidence
          gumroad products page preview dynbtp gumroad-landings/embrace-of-eternity/landing.html \
            --json --no-input --non-interactive > gumroad-publish-evidence/preview.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("gumroad-publish-evidence/preview.json").read_text(encoding="utf-8"))
          report = data.get("sanitization_report")
          if not isinstance(report, dict):
              raise SystemExit("Missing sanitization_report; publishing is blocked.")
          Path("gumroad-publish-evidence/sanitization-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8"
          )
          if (report.get("removed_tags") != [] or
              report.get("removed_attributes") != [] or
              report.get("total_removed") != 0 or
              report.get("truncated") is not False):
              raise SystemExit("Sanitization is not clean; publishing is blocked.")
          print("Clean sanitization confirmed: zero removals, not truncated.")
          PY

      - name: Publish custom landing page to EMBRACE OF ETERNITY only
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          gumroad products page publish dynbtp gumroad-landings/embrace-of-eternity/landing.html \
            --json --no-input --non-interactive > gumroad-publish-evidence/publish.json
          echo "Gumroad accepted the custom landing page publish command."

      - name: Retrieve and record published landing URL
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          gumroad products page url dynbtp \
            --json --jq '.product.landing_url' --no-input --non-interactive \
            > gumroad-publish-evidence/landing-url.txt
          test -s gumroad-publish-evidence/landing-url.txt
          echo "Published landing URL retrieved."

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embrace-of-eternity-publish-evidence
          path: gumroad-publish-evidence/
          if-no-files-found: warn
          retention-days: 30
