name: Refresh Gumroad Product Landing Pages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gumroad-landing-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out storefront
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Gumroad CLI
        run: |
          set -euo pipefail
          curl -fsSL https://gumroad.com/install-cli.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          command -v gumroad
          gumroad --help >/dev/null

      - name: Generate, preview, validate and publish all eligible landing pages
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/refresh_gumroad_landing_pages.py

      - name: Commit refreshed Gumroad landing sources and evidence
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gumroad-landings/
          git add gumroad-landing-refresh-evidence/
          if git diff --cached --quiet; then
            echo "No landing source changes."
          else
            git commit -m "Refresh Gumroad landing pages with mobile-first multilingual layout"
            git fetch origin main
            git rebase --autostash origin/main
            git push origin HEAD:main
          fi

      - name: Upload refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gumroad-landing-refresh-evidence
          path: gumroad-landing-refresh-evidence/
          if-no-files-found: warn
          retention-days: 30
