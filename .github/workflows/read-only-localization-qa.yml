name: Read-only localization and landing-page QA

on:
  # Run the same read-only checks on every repair-branch update, not only
  # after PR events. This makes iterative localization fixes testable at once.
  push:
    branches:
      - "fix/**"
    paths:
      - ".github/workflows/read-only-localization-qa.yml"
      - "catalog-data.json"
      - "locales/**"
      - "assets/**"
      - "scripts/**"
      - "landing/**"
      - "index.html"
      - "tests/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/read-only-localization-qa.yml"
      - "catalog-data.json"
      - "locales/**"
      - "assets/**"
      - "scripts/**"
      - "landing/**"
      - "index.html"
      - "tests/**"

permissions:
  contents: read

jobs:
  localization-and-landing-qa:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python script syntax
        run: python -m compileall -q scripts

      - name: Test Gumroad product-detail extraction boundaries
        run: python tests/test_gumroad_product_detail_extraction.py

      - name: Install offline translation engine
        run: python -m pip install --disable-pip-version-check argostranslate

      - name: Generate missing multilingual section UI keys
        run: python scripts/translate_catalog.py

      - name: Validate locale completeness and Arabic editorial checks
        run: python scripts/validate_locales.py

      - name: Generate product landing pages locally
        run: |
          python scripts/generate_landing_pages.py
          python scripts/enhance_landing_pages.py
          python scripts/generate_sitemap.py

      - name: Validate product pages, localization markers, RTL, and SEO
        run: python scripts/validate_landing_pages.py

      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Generate six e-book pages locally (no Gumroad API or token)
        run: python scripts/refresh_ebook_landing_pages.py --local-only

      - name: Generate one artwork product page locally (no Gumroad API or token)
        env:
          PREVIEW_PERMALINK: mxrljy
        run: python scripts/refresh_gumroad_landing_pages.py --local-only

      - name: Generate one curated e-book product page locally (no Gumroad API or token)
        env:
          PREVIEW_PERMALINK: qsznm
        run: python scripts/refresh_gumroad_landing_pages.py --local-only

      - name: Start local storefront preview
        run: |
          nohup python -m http.server 8000 --bind 127.0.0.1 >/tmp/hog-local-preview.log 2>&1 &
          echo $! >/tmp/hog-local-preview.pid

      - name: Test language switching, refresh, RTL, all product pages, and published site
        run: python scripts/test_localized_browser.py --local-only

      - name: Test Gumroad product landing translations against gallery locale files
        run: python scripts/test_gumroad_landing_localization.py

      - name: Test five-unit gallery layout, pagination, Gumroad links, and mobile grids
        run: python scripts/test_responsive_storefront.py

      - name: Test all six e-book pages in Chromium and capture screenshots
        run: python scripts/test_ebook_landing_pages.py

      - name: Capture independent artwork and e-book previews on desktop and mobile
        run: |
          mkdir -p product-preview-evidence/artwork product-preview-evidence/ebook
          cp gumroad-landings/the-art-of-stillness/landing.html product-preview-evidence/artwork/index.html
          cp gumroad-landings/the-ai-black-box/landing.html product-preview-evidence/ebook/index.html
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          base = "http://127.0.0.1:8000"
          pages = [
              ("artwork", "/gumroad-landings/the-art-of-stillness/landing.html", "product-preview-evidence/artwork"),
              ("ebook", "/gumroad-landings/the-ai-black-box/landing.html", "product-preview-evidence/ebook"),
          ]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for kind, path, output in pages:
                  for device, viewport in [
                      ("desktop", {"width": 1440, "height": 1000}),
                      ("mobile", {"width": 390, "height": 844}),
                  ]:
                      page = browser.new_page(viewport=viewport, device_scale_factor=1)
                      errors = []
                      page.on("pageerror", lambda exc: errors.append(str(exc)))
                      response = page.goto(base + path, wait_until="networkidle", timeout=30000)
                      assert response and response.status == 200, f"{kind} {device}: page failed to load"
                      assert page.locator("body").inner_text().strip(), f"{kind} {device}: empty page"
                      page.screenshot(path=f"{output}/{device}.png", full_page=True)
                      assert not errors, f"{kind} {device}: JavaScript errors: {errors}"
                      print(f"PASS {kind} {device}: {page.title()}")
                      page.close()
              browser.close()
          PY

      - name: Upload independent artwork preview
        uses: actions/upload-artifact@v4
        with:
          name: artwork-product-preview
          path: product-preview-evidence/artwork/
          if-no-files-found: error
          retention-days: 30

      - name: Upload independent e-book preview
        uses: actions/upload-artifact@v4
        with:
          name: ebook-product-preview
          path: product-preview-evidence/ebook/
          if-no-files-found: error
          retention-days: 30

      - name: Upload six-page e-book browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-ebook-pages-browser-evidence
          path: ebook-landing-refresh-evidence/
          if-no-files-found: warn
          retention-days: 30
