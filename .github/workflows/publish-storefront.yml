name: Publish HALL OF GREATNESS storefront

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out storefront repository
        uses: actions/checkout@v4
      - name: Validate product catalogue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("catalog-data.json").read_text(encoding="utf-8"))
          products = data["products"]
          assert len(products) == 33, f"Expected 33 products, got {len(products)}"
          assert sum(bool(p["is_bundle"]) for p in products) == 4
          assert all(p.get("url", "").startswith("https://") for p in products)
          assert all(p.get("published") for p in products)
          assert sum(bool(p["is_bundle"]) for p in products) == 4
          print("Catalogue OK: 33 published products, including 4 bundles.")
          PY
      - name: Validate and prepare storefront pages
        run: |
          set -euo pipefail
          pages=(
            "last-cry-of-earth"
            "a-stairway-of-hands"
            "the-art-of-inner-peace"
            "the-legacy-of-generations"
            "the-hand-that-holds-tomorrow"
            "the-golden-thread-of-humanity"
          )
          test -d landing
          for page in "${pages[@]}"; do
            file="landing/$page/index.html"
            test -s "$file" || { echo "Missing landing page: $file"; exit 1; }
            grep -Eqi '<title>[^<]+</title>' "$file" || { echo "Missing page title: $file"; exit 1; }
            grep -Eqi '<img[^>]+src=' "$file" || { echo "Missing artwork image: $file"; exit 1; }
            grep -Eqi 'gumroad\.com/' "$file" || { echo "Missing Gumroad purchase link: $file"; exit 1; }
          done
          mkdir -p _site
          cp index.html catalog-data.json _site/
          cp -R landing _site/
          test "$(find _site/landing -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq "${#pages[@]}"
          echo "Storefront OK: main page, catalogue, and ${#pages[@]} landing pages are included."
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
