name: Publish HALL OF GREATNESS storefront

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-storefront.yml"
      - "scripts/discover_public_gumroad_products.py"
      - "scripts/import_public_gumroad_product.py"
      - "scripts/generate_landing_pages.py"
      - "scripts/enhance_landing_pages.py"
      - "scripts/generate_sitemap.py"
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out storefront repository
        uses: actions/checkout@v4

      - name: Install Playwright for public Gumroad discovery
        run: |
          set -euo pipefail
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Discover and import newly published public Gumroad products without OAuth
        run: |
          set -euo pipefail
          python scripts/discover_public_gumroad_products.py

      - name: Validate catalogue and generate landing pages
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("catalog-data.json").read_text(encoding="utf-8"))
          products = data["products"]
          published = [p for p in products if p.get("published")]
          bundles = [p for p in published if p.get("is_bundle")]
          assert len(products) == len(published), "Catalogue must contain published products only"
          assert all(p.get("url", "").startswith("https://") for p in published)
          assert all(p.get("landing_slug") and p.get("cover_url", "").startswith("https://") and p.get("summary") for p in published)
          slugs = [p["landing_slug"] for p in published]
          assert len(slugs) == len(set(slugs)), "Landing slugs must be unique"
          for bundle in bundles:
              assert bundle.get("bundle_contents"), f'Missing bundle contents: {bundle["name"]}'
          print(f"Catalogue OK: {len(published)} published products ({len(published)-len(bundles)} individual artworks + {len(bundles)} bundles); drafts excluded.")
          PY
          python scripts/generate_landing_pages.py
          python scripts/enhance_landing_pages.py
          python scripts/generate_sitemap.py

      - name: Validate all product landing pages
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("catalog-data.json").read_text(encoding="utf-8"))
          published = [p for p in data["products"] if p.get("published")]
          for p in published:
              path = Path("landing") / p["landing_slug"] / "index.html"
              assert path.is_file() and path.stat().st_size > 1000, f"Missing or empty page: {path}"
              page = path.read_text(encoding="utf-8")
              assert "<title>" in page and "</title>" in page, f"Missing title: {path}"
              assert p["cover_url"] in page, f"Wrong or missing cover: {path}"
              assert p["url"] in page, f"Wrong or missing Gumroad link: {path}"
              assert "HALL OF GREATNESS" in page, f"Missing brand: {path}"
              assert 'id="printing"' in page, f"Missing buyer print guidance: {path}"
              assert "Digital download" in page, f"Missing digital product clarity: {path}"
              assert 'id="room-showcase"' in page, f"Missing room mockup section: {path}"
              assert page.count('class="room-artwork"') == 1, f"Expected one clean, proportion-preserving artwork presentation: {path}"
              assert page.count(p["cover_url"]) >= 2, f"Original cover missing from hero or artwork presentation: {path}"
          pages = list(Path("landing").glob("*/index.html"))
          assert len(pages) == len(published), f"Expected {len(published)} landing pages, found {len(pages)}"
          print(f"Landing pages OK: {len(pages)} pages; titles, covers, and exact Gumroad URLs verified.")
          home = Path("index.html").read_text(encoding="utf-8")
          for link in ("privacy.html", "terms.html", "contact.html"):
              assert f'href="./{link}"' in home, f"Missing homepage trust link: {link}"
              assert Path(link).is_file(), f"Missing information page: {link}"
          for meta in ('property="og:title"', 'property="og:description"', 'name="twitter:card"', 'rel="canonical"'):
              assert meta in home, f"Missing homepage SEO metadata: {meta}"
          for p in published:
              page = (Path("landing") / p["landing_slug"] / "index.html").read_text(encoding="utf-8")
              for link in ("../../privacy.html", "../../terms.html", "../../contact.html"):
                  assert link in page, f"Missing landing-page trust link in {p['landing_slug']}"
              assert 'name="twitter:card"' in page, f"Missing social metadata in {p['landing_slug']}"
          assert Path("robots.txt").is_file() and Path("sitemap.xml").is_file()
          assert "Sitemap: " in Path("robots.txt").read_text(encoding="utf-8")
          assert len(list(Path("sitemap.xml").read_text(encoding="utf-8").split("<loc>"))) - 1 == len(published) + 4
          print("Trust and SEO checks OK: legal/contact pages, social metadata, robots.txt, and sitemap.")
          PY
          mkdir -p _site
          cp index.html catalog-data.json robots.txt sitemap.xml privacy.html terms.html contact.html _site/
          cp -R landing _site/
          echo "Storefront artifact prepared with all product landing pages."

      - name: Persist newly synced catalogue and landing pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-data.json landing/ public-gumroad-discovery-report.json
          if git diff --cached --quiet; then
            echo "No catalogue or landing-page changes to persist."
          else
            git commit -m "Sync newly published Gumroad products"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
