name: Publish HALL OF GREATNESS storefront

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-storefront.yml"
      - "index.html"
      - "scripts/discover_public_gumroad_products.py"
      - "scripts/import_public_gumroad_product.py"
      - "scripts/generate_landing_pages.py"
      - "scripts/enhance_landing_pages.py"
      - "scripts/generate_sitemap.py"
      - "scripts/translate_catalog.py"
      - "locales/**"
      - "assets/i18n.js"
      - "assets/landing-i18n.js"
      - "assets/landing-copy.json"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out storefront repository
        uses: actions/checkout@v4

      - name: Install Playwright for public Gumroad discovery
        run: |
          set -euo pipefail
          python -m pip install playwright==1.56.0
          python -m playwright install chromium

      - name: Discover and import newly published public Gumroad products without OAuth
        run: |
          set -euo pipefail
          python scripts/discover_public_gumroad_products.py

      - name: Cache free translation models
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
          key: argos-models-v1-${{ runner.os }}-global

      - name: Install free open-source translation engine
        run: python -m pip install --disable-pip-version-check argostranslate

      - name: Generate and refresh multilingual UI and product translations
        run: python scripts/translate_catalog.py

      - name: Validate catalogue and generate landing pages
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("catalog-data.json").read_text(encoding="utf-8"))
          products = data["products"]
          published = [p for p in products if p.get("published")]
          bundles = [p for p in published if p.get("is_bundle")]
          assert len(products) == len(published), "Catalogue must contain published products only"
          assert all(p.get("url", "").startswith("https://") for p in published)
          assert all(p.get("landing_slug") and p.get("cover_url", "").startswith("https://") and p.get("summary") for p in published)
          slugs = [p["landing_slug"] for p in published]
          assert len(slugs) == len(set(slugs)), "Landing slugs must be unique"
          for bundle in bundles:
              assert bundle.get("bundle_contents"), f'Missing bundle contents: {bundle["name"]}'
          print(f"Catalogue OK: {len(published)} published products ({len(published)-len(bundles)} individual artworks + {len(bundles)} bundles); drafts excluded.")
          PY
          python scripts/generate_landing_pages.py
          python scripts/enhance_landing_pages.py
          python scripts/generate_sitemap.py

      - name: Validate all product landing pages
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("catalog-data.json").read_text(encoding="utf-8"))
          published = [p for p in data["products"] if p.get("published")]
          for p in published:
              path = Path("landing") / p["landing_slug"] / "index.html"
              assert path.is_file() and path.stat().st_size > 1000, f"Missing or empty page: {path}"
              page = path.read_text(encoding="utf-8")
              assert "<title>" in page and "</title>" in page, f"Missing title: {path}"
              assert p["cover_url"] in page, f"Wrong or missing cover: {path}"
              assert p["url"] in page, f"Wrong or missing Gumroad link: {path}"
              assert "HALL OF GREATNESS" in page, f"Missing brand: {path}"
              assert 'id="printing"' in page, f"Missing buyer print guidance: {path}"
              assert "Digital download" in page, f"Missing digital product clarity: {path}"
              assert 'id="room-showcase"' in page, f"Missing room mockup section: {path}"
              assert page.count('class="room-artwork"') == 1, f"Expected one clean, proportion-preserving artwork presentation: {path}"
              assert page.count(p["cover_url"]) >= 2, f"Original cover missing from hero or artwork presentation: {path}"
          pages = list(Path("landing").glob("*/index.html"))
          assert len(pages) == len(published), f"Expected {len(published)} landing pages, found {len(pages)}"
          print(f"Landing pages OK: {len(pages)} pages; titles, covers, and exact Gumroad URLs verified.")
          home = Path("index.html").read_text(encoding="utf-8")
          for link in ("privacy.html", "terms.html", "contact.html"):
              assert f'href="./{link}"' in home, f"Missing homepage trust link: {link}"
              assert Path(link).is_file(), f"Missing information page: {link}"
          for meta in ('property="og:title"', 'property="og:description"', 'name="twitter:card"', 'rel="canonical"'):
              assert meta in home, f"Missing homepage SEO metadata: {meta}"
          for p in published:
              page = (Path("landing") / p["landing_slug"] / "index.html").read_text(encoding="utf-8")
              for link in ("../../privacy.html", "../../terms.html", "../../contact.html"):
                  assert link in page, f"Missing landing-page trust link in {p['landing_slug']}"
              assert 'name="twitter:card"' in page, f"Missing social metadata in {p['landing_slug']}"
          assert Path("robots.txt").is_file() and Path("sitemap.xml").is_file()
          assert "Sitemap: " in Path("robots.txt").read_text(encoding="utf-8")
          assert len(list(Path("sitemap.xml").read_text(encoding="utf-8").split("<loc>"))) - 1 == len(published) + 4
          print("Trust and SEO checks OK: legal/contact pages, social metadata, robots.txt, and sitemap.")

          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser

          class HTMLSmokeParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.metas = []
              def handle_starttag(self, tag, attrs):
                  if tag == "meta":
                      self.metas.append(dict(attrs))

          # Strictly guard against malformed or duplicated document head tags.
          home = Path("index.html").read_text(encoding="utf-8")
          assert home.count("<head>") == 1, "Homepage must contain exactly one opening <head> tag"
          assert home.count("</head>") == 1, "Homepage must contain exactly one closing </head> tag"
          home_parser = HTMLSmokeParser()
          home_parser.feed(home)

          # Validate SEO-critical structure on every generated landing page.
          for p in published:
              path = Path("landing") / p["landing_slug"] / "index.html"
              page = path.read_text(encoding="utf-8")
              assert page.count("<head>") == 1 and page.count("</head>") == 1, f"Malformed head tags: {path}"
              page_parser = HTMLSmokeParser()
              page_parser.feed(page)
              assert 'rel="canonical"' in page, f"Missing canonical: {path}"
              assert 'name="description"' in page, f"Missing meta description: {path}"
              assert not any(meta.get("name", "").lower() == "robots" and "noindex" in meta.get("content", "").lower() for meta in page_parser.metas), f"Unexpected noindex: {path}"
              assert "<title>" in page and "</title>" in page, f"Missing title: {path}"

          # Parse sitemap as XML (not just text) and verify all expected URLs.
          sitemap_path = Path("sitemap.xml")
          tree = ET.parse(sitemap_path)
          root = tree.getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9",
                "image": "http://www.google.com/schemas/sitemap-image/1.1"}
          assert root.tag == "{http://www.sitemaps.org/schemas/sitemap/0.9}urlset", "Unexpected sitemap root"
          locs = [node.text for node in root.findall("sm:url/sm:loc", ns)]
          assert len(locs) == len(set(locs)), "Duplicate sitemap URLs"
          expected = {"https://hallofgreatnessart.github.io/hall-of-greatness-storefront/"}
          expected.update("https://hallofgreatnessart.github.io/hall-of-greatness-storefront/" + x for x in ("privacy.html", "terms.html", "contact.html"))
          expected.update("https://hallofgreatnessart.github.io/hall-of-greatness-storefront/landing/" + p["landing_slug"].strip("/") + "/" for p in published)
          assert set(locs) == expected, f"Sitemap URL mismatch: expected {len(expected)}, found {len(locs)}"
          image_entries = root.findall("sm:url/image:image", ns)
          assert len(image_entries) == len(published), f"Expected {len(published)} image sitemap entries, found {len(image_entries)}"

          robots = Path("robots.txt").read_text(encoding="utf-8")
          assert "User-agent: *" in robots and "Allow: /" in robots
          assert "Sitemap: https://hallofgreatnessart.github.io/hall-of-greatness-storefront/sitemap.xml" in robots
          print(f"HTML/SEO/XML validation OK: homepage + {len(published)} landing pages; {len(locs)} sitemap URLs; {len(image_entries)} image entries.")
          PY
          mkdir -p _site
          cp index.html catalog-data.json robots.txt sitemap.xml privacy.html terms.html contact.html _site/
          cp -R assets locales _site/
          cp -R landing _site/
          echo "Storefront artifact prepared with all product landing pages."

      - name: Persist newly synced catalogue and landing pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-data.json landing/ locales/ public-gumroad-discovery-report.json
          if git diff --cached --quiet; then
            echo "No catalogue or landing-page changes to persist."
          else
            git commit -m "Sync newly published Gumroad products"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
