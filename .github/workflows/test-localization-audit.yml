name: Test localization audit (non-production)

on:
  push:
    branches:
      - feat/localization-quality-audit-phase1
    paths:
      - "scripts/audit_localization.py"
      - "scripts/audit_translation_engine_coverage.py"
      - "tests/test_audit_localization.py"
      - ".github/workflows/test-localization-audit.yml"

permissions:
  contents: read

jobs:
  localization-audit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run fixture tests
        run: python -m unittest discover -s tests -v
      - name: Install translation engine for model inventory
        run: python -m pip install --disable-pip-version-check argostranslate
      - name: Run read-only audit against repository
        run: |
          python scripts/audit_localization.py > localization-audit-report.json
          python scripts/audit_localization.py --format summary
      - name: Check Argos model coverage without translating content
        run: |
          python scripts/audit_translation_engine_coverage.py > translation-engine-coverage.json
          python scripts/audit_translation_engine_coverage.py --summary
      - name: Upload localization audit reports
        uses: actions/upload-artifact@v4
        with:
          name: localization-audit-reports
          path: |
            localization-audit-report.json
            translation-engine-coverage.json
          if-no-files-found: error

# Isolated test workflow; never deploys or writes to production.

# Re-run tests whenever the audit implementation changes.

# QA-only workflow; artifact is a report, not a deployment input.

# Include translation-model coverage inventory in the same isolated QA run.
