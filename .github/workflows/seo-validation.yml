name: SEO and sitemap validation

on:
  push:
    branches:
      - "fix/**"
    paths:
      - "index.html"
      - "catalog-data.json"
      - "landing/**"
      - "scripts/**"
      - ".github/workflows/seo-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "catalog-data.json"
      - "landing/**"
      - "scripts/**"
      - ".github/workflows/seo-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Generate landing pages and sitemap
        run: |
          set -euo pipefail
          python scripts/generate_landing_pages.py
          python scripts/enhance_landing_pages.py
          python scripts/generate_sitemap.py
          python scripts/validate_landing_pages.py
      - name: Validate HTML, SEO metadata, robots.txt and sitemap XML
        run: python scripts/validate_seo.py

      - name: Validate locale coverage and Arabic content
        run: python scripts/validate_locales.py

      - name: Install Chromium for localized browser checks
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Start local storefront preview
        run: |
          nohup python -m http.server 8000 --bind 127.0.0.1 >/tmp/hog-local-preview.log 2>&1 &
          echo $! >/tmp/hog-local-preview.pid

      - name: Test homepage and all product pages in Arabic and English
        run: python scripts/test_localized_browser.py --local-only
