name: Verify every public Gumroad product page

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

jobs:
  verify-public-products:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out storefront
        uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify every published catalogue URL
        run: python scripts/verify_all_gumroad_products.py
      - name: Upload per-product verification report
        uses: actions/upload-artifact@v4
        with:
          name: gumroad-public-product-verification
          path: gumroad-product-verification-report.json
          if-no-files-found: error
          retention-days: 30
