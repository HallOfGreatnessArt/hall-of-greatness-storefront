YAML

name: Gumroad SEO Automation - Safe Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fetch Gumroad products (read-only)
        env:
          GUMROAD_TOKEN: ${{ secrets.GUMROAD_SEO_AUTOMATION_TOKEN }}
        run: |
          set +x
          if [ -z "$GUMROAD_TOKEN" ]; then
            echo "ERROR: SEO automation token is missing."
            exit 1
          fi

          HTTP_CODE=$(curl -sS \
            -o /tmp/gumroad-response.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $GUMROAD_TOKEN" \
            -H "Accept: application/json" \
            "https://api.gumroad.com/v2/products")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Gumroad API returned HTTP $HTTP_CODE"
            exit 1
          fi

          python - <<'PY'
          import json, sys

          with open("/tmp/gumroad-response.json", encoding="utf-8") as f:
              data = json.load(f)

          if not data.get("success"):
              print("ERROR: Gumroad API reported failure.")
              sys.exit(1)

          products = data.get("products", [])
          safe = []

          for p in products:
              safe.append({
                  "name": p.get("name", ""),
                  "permalink": p.get("permalink", ""),
                  "url": p.get("short_url", "")
              })

          with open("gumroad-products-audit.json", "w", encoding="utf-8") as f:
              json.dump(safe, f, ensure_ascii=False, indent=2)

          print(f"Audit successful. Products returned: {len(safe)}")
          print("Read-only audit completed. No products were modified.")
          PY

      - name: Save safe audit report
        uses: actions/upload-artifact@v4
        with:
          name: gumroad-products-audit
          path: gumroad-products-audit.json
          retention-days: 7
