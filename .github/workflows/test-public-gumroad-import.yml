name: Test public Gumroad import without OAuth

on:
  push:
    branches:
      - test/public-gumroad-import-no-oauth
    paths:
      - "scripts/import_public_gumroad_product.py"
      - ".github/workflows/test-public-gumroad-import.yml"
  workflow_dispatch:
    inputs:
      product_url:
        description: Public Gumroad product URL to import
        required: true
        default: "https://alshayebemad.gumroad.com/l/EternalEgypt"
      expected_permalink:
        description: Gumroad permalink expected in the imported catalogue
        required: true
        default: "wjxgxb"

permissions:
  contents: write

concurrency:
  group: gumroad-test-branch-writer
  cancel-in-progress: false

jobs:
  import-one-public-product:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated test branch
        uses: actions/checkout@v4
        with:
          ref: test/public-gumroad-import-no-oauth
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright browser for public page rendering
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Import one public product without OAuth
        env:
          PRODUCT_URL: ${{ github.event.inputs.product_url || 'https://alshayebemad.gumroad.com/l/EternalEgypt' }}
        run: |
          set -euo pipefail
          python scripts/import_public_gumroad_product.py --url "$PRODUCT_URL"
      - name: Generate and validate the landing page
        env:
          EXPECTED_PERMALINK: ${{ github.event.inputs.expected_permalink || 'wjxgxb' }}
        run: |
          set -euo pipefail
          python scripts/generate_landing_pages.py
          python scripts/enhance_landing_pages.py
          python - <<'PY'
          import json
          from pathlib import Path
          import html, os
          data = json.loads(Path("catalog-data.json").read_text(encoding="utf-8"))
          expected = os.environ["EXPECTED_PERMALINK"]
          product = next(p for p in data["products"] if p["permalink"] == expected)
          page = Path("landing") / product["landing_slug"] / "index.html"
          assert page.is_file(), f"Landing page was not generated: {page}"
          text = html.unescape(page.read_text(encoding="utf-8"))
          assert product["name"] in text
          assert product["url"] in text
          assert product["cover_url"] in text
          assert f'{product["price_usd"]:.2f}' in text
          assert product.get("full_description"), "Full product description was not imported"
          assert product.get("product_details", {}).get("delivery"), "Delivery details missing"
          if product.get("is_bundle"):
              assert len(product.get("bundle_contents", [])) == 7, f"Expected exactly seven linked bundle artworks, found {len(product.get('bundle_contents', []))}"
              assert "This collection" in text or "Inside this collection" in text
              for permalink in product["bundle_contents"]:
                  item = next(p for p in data["products"] if p["permalink"] == permalink)
                  assert item["name"].strip() in text, f"Bundle item missing from landing page: {item['name']}"
              print(f"PASS: {product['name']} | bundle items={len(product['bundle_contents'])} | {page}")
          else:
              included = product.get("product_details", {}).get("files_included", "")
              assert included, "Multi-file product file list missing"
              assert "4 files" in included and all(fmt in included for fmt in ("JPG", "PDF", "PNG", "TXT")), included
              assert "9.1 MB" in included, included
              assert included in text
              print(f"PASS: {product['name']} | multi-file package={included} | {page}")
          PY
      - name: Commit test catalogue and page to isolated branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-data.json landing/
          if git diff --cached --quiet; then
            echo "No changes to commit; product may already exist."
          else
            git commit -m "Test no-OAuth import for one public Gumroad product"
            git push origin HEAD:test/public-gumroad-import-no-oauth
          fi
